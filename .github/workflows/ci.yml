name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # install dependencies
      - name: "Install dependencies"
        run: |
          # update package manager...
          sudo apt-get -y update ; sudo apt-get -y upgrade
          # install gcc...
          sudo apt-get install -y build-essential
          # install clang...
          sudo apt-get install -y clang
          # install gtest...
          sudo apt-get install -y libgtest-dev

      # check compilation status
      - name: "Test no.0: Compilation status"
        run: |
          set -x

          # test C modules...
          
          gcc -Wall -Wextra -Werror -std=c99 tests/00-compile.c -lm
          clang -Wall -Wextra -Werror -std=c99 tests/00-compile.c -lm
          
          # test C++ modules...
          
          g++ -Wall -Wextra -Werror -std=c++11 tests/00-compile.cc -lm
          clang++ -Wall -Wextra -Werror -std=c++11 tests/00-compile.cc -lm
      
      # check vec2 module
      - name: "Test no.1: vec2 module"
        run: |
          set -x
          
          g++ -Wall -Wextra -Werror tests/01-vec2.cc -lm -lgtest
          ./a.out && rm -f a.out
      
      # check vec3 module
      - name: "Test no.2: vec3 module"
        run: |
          set -x
          
          g++ -Wall -Wextra -Werror tests/02-vec3.cc -lm -lgtest
          ./a.out && rm -f a.out
      
      # check vec2 module
      - name: "Test no.3: vec4 module"
        run: |
          set -x
          
          g++ -Wall -Wextra -Werror tests/03-vec4.cc -lm -lgtest
          ./a.out && rm -f a.out
      
      # check vec2 module
      - name: "Test no.4: mat2 module"
        run: |
          set -x
          
          g++ -Wall -Wextra -Werror tests/04-mat2.cc -lm -lgtest
          ./a.out && rm -f a.out
      
      # check vec2 module
      - name: "Test no.5: mat3 module"
        run: |
          set -x
          
          g++ -Wall -Wextra -Werror tests/05-mat3.cc -lm -lgtest
          ./a.out && rm -f a.out
      
      # check vec2 module
      - name: "Test no.6: vec4 module"
        run: |
          set -x
          
          g++ -Wall -Wextra -Werror tests/01-vec2.cc -lm -lgtest
          ./a.out && rm -f a.out
