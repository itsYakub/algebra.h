name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # install dependencies
      - name: "Install dependencies"
        run:  sudo apt-get install -y build-essential

      # check compilation status
      - name: "Test no.0: Compilation status"
        run: |
          # test C modules
          gcc -Wall -Wextra -Werror -std=c99   tests/00-compile.c  -lm
          # test C++ modules
          g++ -Wall -Wextra -Werror -std=c++11 tests/00-compile.cc -lm
